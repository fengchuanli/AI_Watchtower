<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="AI Watchtower 全部 AI 新闻列表，按时间顺序整理进入本站的当前与归档线索，旧批次只作背景回看。" />
    <meta name="application-name" content="AI Watchtower" />
    <meta name="theme-color" content="#111827" />
    <meta property="og:site_name" content="AI Watchtower" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="全部 AI 新闻 | AI Watchtower" />
    <meta
      property="og:description"
      content="按时间顺序整理 AI Watchtower 当前与归档 AI 新闻；旧批次用于背景回看，当前首页批次会单独标出。"
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="全部 AI 新闻 | AI Watchtower" />
    <meta
      name="twitter:description"
      content="按时间顺序整理 AI Watchtower 当前与归档 AI 新闻；旧批次用于背景回看，当前首页批次会单独标出。"
    />
    <title>全部 AI 新闻 | AI Watchtower</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <header class="site-header">
      <a class="brand" href="./" aria-label="AI Watchtower 首页">
        <span class="brand-mark">AW</span>
        <span>AI Watchtower</span>
      </a>
      <nav class="nav-links" aria-label="全部题目列表相关页面">
        <a href="./#feed">最新新闻流</a>
        <a href="./#deep-briefing">本期深度简报</a>
        <a href="./tags.html">公司连续观察</a>
        <a href="./archive.html">期次归档状态</a>
      </nav>
      <a class="header-action" href="./">返回首页</a>
    </header>

    <main id="main-content" class="all-news-page">
      <section class="section compact">
        <p class="eyebrow">AI News History</p>
        <h1>全部 AI 新闻</h1>
        <p class="section-copy">
          按时间顺序整理进入 AI Watchtower 的当前与归档 AI 新闻线索。本页适合快速扫标题；旧批次只作背景回看，当前首页批次会单独标出。
        </p>
        <div class="history-toolbar" aria-live="polite">
          <p id="historyMeta">正在读取历史 AI 新闻...</p>
          <a class="text-link" href="./data/news-history.json" aria-label="打开原始历史 AI 新闻 JSON 数据">查看历史数据</a>
        </div>
        <div class="history-controls" id="historyControls" hidden>
          <div>
            <p class="control-label">按主题缩小</p>
            <div class="history-filter-tabs" id="historyCategoryFilters" aria-label="按分类筛选历史 AI 新闻"></div>
          </div>
          <label class="history-sort-control" for="historySort">
            <span class="control-label">排序</span>
            <select id="historySort" aria-label="按新闻发布时间排序历史 AI 新闻">
              <option value="newest">最新新闻优先</option>
              <option value="oldest">最早新闻优先</option>
            </select>
          </label>
        </div>
        <p class="history-result-note" id="historyResultNote" aria-live="polite"></p>
      </section>

      <section class="section compact" aria-labelledby="history-list-title">
        <div class="section-heading row">
          <div>
            <p class="eyebrow">Captured Items</p>
            <h2 id="history-list-title">按时间排序的 AI 新闻</h2>
          </div>
        </div>
        <div class="history-list" id="historyList" aria-live="polite" aria-label="历史 AI 新闻题目列表">
          <p class="feed-state">正在生成 AI 新闻列表...</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>AI Watchtower</span>
      <span>All captured intelligence stays readable in site.</span>
    </footer>

    <script src="./all-news.js"></script>
  </body>
</html>
