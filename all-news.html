<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="AI Watchtower 全部历史情报题目列表，按时间、主题和抓取批次帮助中文读者进入站内详情解读。" />
    <meta name="theme-color" content="#111827" />
    <title>全部情报 | AI Watchtower</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <header class="site-header">
      <a class="brand" href="./" aria-label="AI Watchtower 首页">
        <span class="brand-mark">AW</span>
        <span>AI Watchtower</span>
      </a>
      <nav class="nav-links" aria-label="全部情报相关页面">
        <a href="./#feed">最新新闻流</a>
        <a href="./#deep-briefing">深度简报</a>
        <a href="./archive.html">期次归档</a>
      </nav>
      <a class="header-action" href="./">返回首页</a>
    </header>

    <main id="main-content" class="all-news-page">
      <section class="section compact">
        <p class="eyebrow">Intelligence History</p>
        <h1>全部新闻情报</h1>
        <p class="section-copy">
          这里按时间顺序展示目前为止进入 AI Watchtower 的所有情报题目。点击任意题目会打开站内详细解读，不会直接跳到原始来源。
        </p>
        <div class="history-toolbar" aria-live="polite">
          <p id="historyMeta">正在读取历史情报...</p>
          <a class="text-link" href="./data/news-history.json" aria-label="打开原始历史情报 JSON 数据">查看历史数据</a>
        </div>
        <div class="history-controls" id="historyControls" hidden>
          <div>
            <p class="control-label">按主题缩小</p>
            <div class="history-filter-tabs" id="historyCategoryFilters" aria-label="按分类筛选历史情报"></div>
          </div>
          <label class="history-sort-control" for="historySort">
            <span class="control-label">排序</span>
            <select id="historySort" aria-label="按新闻发布时间排序历史情报">
              <option value="newest">最新新闻优先</option>
              <option value="oldest">最早新闻优先</option>
            </select>
          </label>
        </div>
        <p class="history-result-note" id="historyResultNote" aria-live="polite"></p>
      </section>

      <section class="section compact" aria-labelledby="history-list-title">
        <div class="section-heading row">
          <div>
            <p class="eyebrow">Captured Items</p>
            <h2 id="history-list-title">按时间排序的情报题目</h2>
          </div>
        </div>
        <div class="history-list" id="historyList" aria-live="polite" aria-label="历史情报题目列表">
          <p class="feed-state">正在生成情报列表...</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>AI Watchtower</span>
      <span>All captured intelligence stays readable in site.</span>
    </footer>

    <script src="./all-news.js"></script>
  </body>
</html>
