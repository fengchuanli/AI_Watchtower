<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="AI Watchtower 已抓取 AI 新闻情报一览，可进入站内详情解读。" />
    <meta name="theme-color" content="#111827" />
    <title>全部情报 | AI Watchtower</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <header class="site-header">
      <a class="brand" href="./" aria-label="AI Watchtower 首页">
        <span class="brand-mark">AW</span>
        <span>AI Watchtower</span>
      </a>
      <nav class="nav-links" aria-label="All news navigation">
        <a href="./#feed">最新新闻流</a>
        <a href="./#deep-briefing">深度简报</a>
        <a href="./archive.html">期次归档</a>
      </nav>
      <a class="header-action" href="./">返回首页</a>
    </header>

    <main id="main-content" class="all-news-page">
      <section class="section compact">
        <p class="eyebrow">Intelligence History</p>
        <h1>全部新闻情报</h1>
        <p class="section-copy">
          这里按抓取批次保存目前为止进入 AI Watchtower 的情报。点击任意条目会打开站内详细解读，不会直接跳到原始来源。
        </p>
        <div class="history-toolbar" aria-live="polite">
          <p id="historyMeta">正在读取历史情报...</p>
          <a class="text-link" href="./data/news-history.json">查看历史数据</a>
        </div>
      </section>

      <section class="section compact" aria-labelledby="history-list-title">
        <div class="section-heading row">
          <div>
            <p class="eyebrow">Captured Items</p>
            <h2 id="history-list-title">抓取记录一览</h2>
          </div>
        </div>
        <div class="history-list" id="historyList" aria-live="polite">
          <p class="feed-state">正在生成情报列表...</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>AI Watchtower</span>
      <span>All captured intelligence stays readable in site.</span>
    </footer>

    <script src="./all-news.js"></script>
  </body>
</html>
